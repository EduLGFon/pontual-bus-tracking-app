# CI for T03 plus T06 server job. See PLAN.md 17.2.
# Actions pinned by SHA.
# Verified SHAs 2026-10-02 via api.github.com commits endpoints.
name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Flutter analyze
        working-directory: app
        run: flutter analyze
      - name: Dart format check
        working-directory: app
        run: dart format --set-exit-if-changed lib test
      - name: Flutter test
        working-directory: app
        run: flutter test
      - name: Manifest audit
        run: bash tools/ci/manifest_audit.sh
      - name: Web size report
        working-directory: app
        run: flutter build web --release
  server:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      HOST: 127.0.0.1
      PORT: 8080
      DATABASE_URL: postgresql://user:pass@127.0.0.1:5432/dbname
      ALLOWED_ORIGINS: http://127.0.0.1:8080
      TRUST_CLOUDFLARE: "false"
      DATA_DIR: ./build
      LOG_LEVEL: info
      METRICS_PORT: 127.0.0.1:9091
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.7
      - name: Deno fmt check
        working-directory: server
        run: deno fmt --check
      - name: Deno lint
        working-directory: server
        run: deno lint
      - name: Deno check
        working-directory: server
        run: deno check src/main.ts
      - name: Deno test
        working-directory: server
        run: deno task test
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
