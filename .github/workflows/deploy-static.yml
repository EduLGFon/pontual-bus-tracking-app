# Static deploy to GitHub Pages. See PLAN.md 17.2.
# Needs repo var: API_BASE_URL (e.g. https://api.example.com); the web build
# bakes it in via --dart-define. STATIC_ORIGIN defaults to this repo's Pages
# URL and only needs a var for a custom domain.
# One-time owner setup: repo Settings > Pages > Source: GitHub Actions.
# Verified SHAs 2026-10-10 via api.github.com.
name: deploy-static
on:
  push:
    branches: [master]
    paths:
      - "data/**"
      - "app/**"
      - ".github/workflows/deploy-static.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.7
      - name: Resolve origins
        id: origins
        run: |
          test -n "${{ vars.API_ORIGIN }}" || (echo "missing repo var API_ORIGIN (e.g. https://api.example.com); set it in Settings > Secrets and variables > Actions > Variables" && exit 1)
          STATIC="${{ vars.STATIC_ORIGIN }}"
          if [ -z "$STATIC" ]; then STATIC="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"; fi
          echo "api=${{ vars.API_ORIGIN }}" >> "$GITHUB_OUTPUT"
          echo "static=$STATIC" >> "$GITHUB_OUTPUT"
          BASE_PATH="$(printf '%s' "$STATIC" | sed -E 's#^https?://[^/]+##')"
          [ -z "$BASE_PATH" ] && BASE_PATH="/"
          case "$BASE_PATH" in */) BASE_HREF="$BASE_PATH";; *) BASE_HREF="$BASE_PATH/";; esac
          echo "base=$BASE_HREF" >> "$GITHUB_OUTPUT"
          echo "API=${{ vars.API_ORIGIN }} STATIC=$STATIC BASE_HREF=$BASE_HREF"
      - name: Build data bundle
        working-directory: tools
        env:
          API_ORIGIN: ${{ steps.origins.outputs.api }}
        run: deno task data-build
      - name: Build web
        working-directory: app
        run: |
          flutter build web --release --no-web-resources-cdn --wasm \
            --base-href "${{ steps.origins.outputs.base }}" \
            --dart-define=API_BASE_URL=${{ steps.origins.outputs.api }} \
            --dart-define=STATIC_BASE_URL=${{ steps.origins.outputs.static }}/data
      - name: Assemble Pages directory
        run: |
          rm -rf pages && mkdir -p pages/data
          cp -r app/build/web/* pages/
          cp build/lines.*.json build/manifest.json build/config.json pages/data/
          cp pages/index.html pages/404.html
          touch pages/.nojekyll
          ls pages/data
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
